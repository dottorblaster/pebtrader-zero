name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PEBBLE_TOOL_VERSION: "5.0.40"
  PEBBLE_SDK_VERSION: "4.33.1"

jobs:
  build:
    name: Build .pbw
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install uv
        # setup-uv publishes only exact semver tags (no floating major tag).
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          # The pinned tool version lives in this workflow, so hash the
          # workflow to invalidate the uv cache when it changes.
          cache-dependency-glob: ".github/workflows/build.yml"

      - name: Cache Pebble SDK
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pebble-sdk
          key: pebble-sdk-${{ runner.os }}-${{ env.PEBBLE_SDK_VERSION }}-tool-${{ env.PEBBLE_TOOL_VERSION }}

      - name: Install pebble-tool
        run: |
          uv tool install "pebble-tool==${PEBBLE_TOOL_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Pebble SDK
        run: |
          # `pebble sdk install` exits non-zero when the SDK is already
          # installed, so only install on a cache miss. Check the SDK
          # directory directly: `pebble sdk list` also prints available
          # (not installed) versions.
          if [ -d "$HOME/.local/share/pebble-sdk/SDKs/${PEBBLE_SDK_VERSION}" ]; then
            echo "SDK ${PEBBLE_SDK_VERSION} already installed (cache hit)"
          else
            pebble sdk install "${PEBBLE_SDK_VERSION}"
          fi
          pebble sdk activate "${PEBBLE_SDK_VERSION}"

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: pebble build

      - name: Upload .pbw
        uses: actions/upload-artifact@v7
        with:
          name: pebtrader-zero-pbw
          path: build/*.pbw
          if-no-files-found: error
